# Plumbing for your weekly digest, written by the app.
#
# The editorial lens — what this briefing is actually about — is lens.md beside
# this file, and that is the one worth reading. Anything under [advanced] has a
# measured right value behind it; change those only if you have a reason.

schema_version = 1

[models]
provider = "ollama"
classify_provider = "ollama"
classify = "qwen3:30b"
synthesize = "gemma3:27b"

[output]
minutes = 59
folder = "~/digests"
html = true
pdf = false
audio = true

[schedule]
enabled = true
day = "friday"
hour = 17

[delivery]

[delivery.drive]
enabled = false
folder_id = ""
method = "oauth"
rclone_remote = ""

[advanced]
max_items = 60
contest_share = 0.2
fetch_days = 8
ground = true
ground_min_chars = 500
search_backend = "duckduckgo"
source_min_chars = 700
source_max_words = 200
classify_batch_size = 25
seed = 7
classify_thinking = "low"
synthesize_thinking = "medium"
classify_temperature = 0.0
min_interval_seconds = 12.0
max_attempts = 5
max_backoff_seconds = 120.0
ollama_host = "http://localhost:11434"
ollama_num_ctx = 32768
ollama_think = false
ollama_temperature = 0.3
voice = "en-GB-RyanNeural"
tts_engine = "edge"
tts_offline = false
piper_model = ""
chunk_chars = 3000
pdf_engine = "chrome"
