[project]
name = "weekly-news"
version = "0.2.0"
description = "A weekly briefing, filtered and written to your own editorial lens."
requires-python = ">=3.12"
# Deliberately short. Everything a run genuinely cannot do without, and nothing
# that only one provider or one output format needs — an Ollama user should not
# be made to install Google's client, and nobody should need a PDF stack to read
# a text file. The rest are extras the setup wizard installs on request.
dependencies = [
    "certifi>=2024.2",
    "feedparser>=6.0",
    "rapidfuzz>=3.9",
    "markdown>=3.6",
    "platformdirs>=4.2",
    "keyring>=25.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.20"]
anthropic = ["anthropic>=0.40"]
# Ollama speaks plain HTTP and needs no client library. The extra exists so the
# install line reads the same whichever provider you picked.
ollama = []
audio = ["edge-tts>=6.1"]
drive = ["google-api-python-client>=2.140", "google-auth-oauthlib>=1.2"]
pdf = ["weasyprint>=62"]
# The browser is the renderer and the pages are server-rendered HTML, so this is
# a web server and a template engine and nothing else. No front-end build, no
# vendored JavaScript library — what the pages need is about sixty lines and is
# in digest/ui/static/app.js where it can be read.
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0", "google-genai>=2.20", "anthropic>=0.40",
    "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
digest = "digest.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.setuptools.package-data]
digest = ["prompts/*.md", "lenses/*.toml", "lenses/*.md",
          "ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["digest/tests"]
