[project]
name = "weekly-news"
version = "0.1.0"
description = "Weekly world digest — the architecture of rule, not the contest for it."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.20",
    "certifi>=2024.2",
    "feedparser>=6.0",
    "rapidfuzz>=3.9",
    "markdown>=3.6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
audio = ["edge-tts>=6.1", "pydub>=0.25"]
drive = ["google-api-python-client>=2.140", "google-auth-oauthlib>=1.2"]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.setuptools.package-data]
digest = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["digest/tests"]
