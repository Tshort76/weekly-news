{% extends "base.html" %}
{% set active = "schedule" %}
{% block body %}
<h1>Schedule</h1>
<p class="sub">The SwiftBar menu-bar plugin starts the week's run on <b>{{ when.day }}</b> from <b>{{ "%02d"|format(when.hour) }}:00</b>, and on any later refresh that week if the Mac was asleep.</p>

<form method="post" action="/schedule">
  <label>Day
    <select name="day">
      {% for day in days %}<option value="{{ day }}" {{ "selected" if when.day == day }}>{{ day }}</option>{% endfor %}
    </select>
  </label>
  <label>Hour <input class="input" type="number" name="hour" min="0" max="23" value="{{ when.hour }}"></label>
  <div class="actions">
    <button class="primary">Save</button>
  </div>
</form>
{% endblock %}
