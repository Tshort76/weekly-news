<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Weekly digest{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="side">
  <div class="brand">Weekly digest<small>{{ lens_name or "not set up" }}</small></div>
  <a href="/" class="{{ 'on' if active == 'home' }}">This week</a>
  <a href="/lens" class="{{ 'on' if active == 'lens' }}">Lens</a>
  <a href="/calibrate" class="{{ 'on' if active == 'calibrate' }}">Check the lens</a>
  <a href="/feeds" class="{{ 'on' if active == 'feeds' }}">Feeds</a>
  <a href="/schedule" class="{{ 'on' if active == 'schedule' }}">Schedule</a>
  <a href="/settings" class="{{ 'on' if active == 'settings' }}">Settings</a>
  <a href="/about" class="{{ 'on' if active == 'about' }}">About</a>
</nav>
<main>
{% if error %}<p class="banner stop">{{ error }}</p>{% endif %}
{% block body %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
